[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
loglevel=info
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:keycloak]
command=/opt/keycloak/bin/kc.sh start-dev --http-host=127.0.0.1 --http-port=8080 --import-realm
directory=/opt/keycloak
environment=
    KEYCLOAK_ADMIN="kc-admin",
    KEYCLOAK_ADMIN_PASSWORD="%(ENV_KC_ADMIN_PASSWORD)s",
    KC_HTTP_HOST="127.0.0.1",
    KC_DB="dev-file",
    KC_HEALTH_ENABLED="true",
    KC_LOG_LEVEL="WARN"
stdout_logfile=/var/log/keycloak.log
stderr_logfile=/var/log/keycloak.log
stdout_logfile_maxbytes=10MB
autorestart=true
startretries=3
priority=10

[program:locktalk]
command=node /app/server.js
directory=/app
environment=APP_PORT="3000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=3
startsecs=180
priority=20
