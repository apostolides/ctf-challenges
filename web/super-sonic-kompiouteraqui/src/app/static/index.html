<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #333 0, #000 60%);
            font-family: "Courier New", monospace;
            color: #f5f5f5;
        }
        .wrapper {
            width: 380px;
            max-width: 95vw;
        }
        .calculator {
            background: linear-gradient(145deg, #20252b, #15191f);
            border-radius: 18px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.9), 0 0 28px rgba(0, 255, 170, 0.2);
            padding: 18px 18px 12px 18px;
            border: 2px solid #03f5a5;
        }
        .calc-title {
            text-align: center;
            font-size: 20px;
            letter-spacing: 0.2em;
            color: #9ef7cf;
            margin-bottom: 10px;
            text-shadow: 0 0 6px rgba(0, 255, 170, 0.8);
        }
        .display {
            background: #0b1215;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #07c08c;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
        }
        .display-line-main {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 20px;
            color: #9ef7cf;
            text-align: right;
        }
        .display-line-main::placeholder {
            color: #446e5d;
        }
        .display-line-result {
            margin-top: 4px;
            text-align: right;
            font-size: 16px;
            color: #f8e38f;
            min-height: 18px;
        }
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 46px;
            gap: 8px;
        }
        .btn {
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 18px;
            cursor: pointer;
            background: radial-gradient(circle at 20% 20%, #4c566a 0, #1f2430 55%);
            color: #f5f5f5;
            box-shadow: 0 3px 0 #050608;
            transition: transform 0.05s ease, box-shadow 0.05s ease, filter 0.1s;
        }
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #050608;
            filter: brightness(1.1);
        }
        .btn-op {
            background: radial-gradient(circle at 20% 20%, #ff8e3c 0, #c2451e 55%);
        }
        .btn-eq {
            grid-column: span 2;
            background: radial-gradient(circle at 20% 20%, #04f7a9 0, #03a56e 55%);
            color: #02130e;
            font-weight: bold;
        }
        .btn-wide {
            grid-column: span 2;
        }
        .panel {
            margin-top: 14px;
            background: rgba(5, 10, 14, 0.92);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid #1f2933;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
        }
        .panel-title {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .upload-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .upload-row input[type="file"] {
            flex: 1;
            font-size: 12px;
            color: #e5e7eb;
        }
        .upload-row button {
            padding: 6px 10px;
            font-size: 13px;
        }
        .file-list {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .file-button {
            border-radius: 9999px;
            border: 1px solid #374151;
            padding: 4px 10px;
            background: #111827;
            color: #e5e7eb;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.1s, transform 0.05s, box-shadow 0.05s;
            box-shadow: 0 2px 0 #020617;
        }
        .file-button:hover {
            background: #1f2937;
        }
        .file-button:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 #020617;
        }
        .empty {
            font-size: 12px;
            color: #6b7280;
        }
        .status-line {
            margin-top: 6px;
            font-size: 12px;
            color: #9ca3af;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="calculator">
            <div class="calc-title">super kompiouteraqui</div>
            <div class="display">
                <input id="expression" class="display-line-main" type="text" placeholder="Use the keypad" autocomplete="off">
                <div id="result" class="display-line-result"></div>
            </div>
            <div class="keys">
                <button class="btn" data-key="7">7</button>
                <button class="btn" data-key="8">8</button>
                <button class="btn" data-key="9">9</button>
                <button class="btn btn-op" data-key="/">÷</button>

                <button class="btn" data-key="4">4</button>
                <button class="btn" data-key="5">5</button>
                <button class="btn" data-key="6">6</button>
                <button class="btn btn-op" data-key="*">×</button>

                <button class="btn" data-key="1">1</button>
                <button class="btn" data-key="2">2</button>
                <button class="btn" data-key="3">3</button>
                <button class="btn btn-op" data-key="-">-</button>

                <button class="btn btn-wide" data-key="0">0</button>
                <button class="btn" data-key="C">C</button>
                <button class="btn btn-op" data-key="+">+</button>

                <button class="btn btn-eq" data-key="=">=</button>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Upload calculation file (.py with expression)</div>
            <form id="upload-form">
                <div class="upload-row">
                    <input id="file-input" name="file" type="file" accept=".py">
                    <button type="submit" class="btn btn-op" style="font-size:12px; padding:5px 10px;">Upload</button>
                </div>
            </form>
            <div id="upload-status" class="status-line"></div>
        </div>

        <div class="panel">
            <div class="panel-title">Uploaded calculations</div>
            <div id="file-list" class="file-list"></div>
        </div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            var display = document.getElementById("expression");
            var resultEl = document.getElementById("result");
            var fileList = document.getElementById("file-list");
            var uploadForm = document.getElementById("upload-form");
            var fileInput = document.getElementById("file-input");
            var uploadStatus = document.getElementById("upload-status");

            function appendToDisplay(value) {
                display.value += value;
            }

            function clearDisplay() {
                display.value = "";
                resultEl.textContent = "";
            }

            function setResultText(text) {
                resultEl.textContent = text;
            }

            function loadFiles() {
                fetch("/files")
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        fileList.innerHTML = "";
                        if (data.files && data.files.length) {
                            data.files.forEach(function (name) {
                                var btn = document.createElement("button");
                                btn.textContent = name;
                                btn.className = "file-button";
                                btn.addEventListener("click", function () {
                                    setResultText("");
                                    fetch("/calculate?filename=" + encodeURIComponent(name))
                                        .then(function (resp) {
                                            if (!resp.ok) {
                                                return resp.json().then(function (err) {
                                                    throw err;
                                                });
                                            }
                                            return resp.json();
                                        })
                                        .then(function (payload) {
                                            if (typeof payload.expression !== "undefined" && typeof payload.result !== "undefined") {
                                                display.value = payload.expression;
                                                setResultText("= " + payload.result);
                                            }
                                        })
                                        .catch(function (err) {
                                            if (err && err.detail) {
                                                setResultText(err.detail);
                                            } else {
                                                setResultText("Error loading calculation");
                                            }
                                        });
                                });
                                fileList.appendChild(btn);
                            });
                        } else {
                            var empty = document.createElement("div");
                            empty.className = "empty";
                            empty.textContent = "No uploaded calculations yet.";
                            fileList.appendChild(empty);
                        }
                    })
                    .catch(function () {
                        fileList.innerHTML = "";
                        var err = document.createElement("div");
                        err.className = "empty";
                        err.textContent = "Unable to load files.";
                        fileList.appendChild(err);
                    });
            }

            function makeTempFilename() {
                var now = new Date();
                var day = String(now.getDate()).padStart(2, "0");
                var month = String(now.getMonth() + 1).padStart(2, "0");
                var hour = String(now.getHours()).padStart(2, "0");
                var minute = String(now.getMinutes()).padStart(2, "0");
                var second = String(now.getSeconds()).padStart(2, "0");
                return day + "_" + month + "_" + hour + "_" + minute + "_" + second + ".py";
            }

            function uploadExpressionAndCalculate(expr) {
                var trimmed = expr.trim();
                if (!trimmed) {
                    return;
                }
                setResultText("");
                var filename = makeTempFilename();
                var blob = new Blob([trimmed], { type: "text/plain" });
                var file = new File([blob], filename, { type: "text/plain" });
                var formData = new FormData();
                formData.append("file", file);
                fetch("/upload", { method: "POST", body: formData })
                    .then(function (resp) {
                        return resp.json().then(function (data) {
                            if (!resp.ok) {
                                throw data;
                            }
                            return data;
                        });
                    })
                    .then(function () {
                        return fetch("/calculate?filename=" + encodeURIComponent(filename));
                    })
                    .then(function (resp) {
                        return resp.json().then(function (data) {
                            if (!resp.ok) {
                                throw data;
                            }
                            return data;
                        });
                    })
                    .then(function (data) {
                        if (typeof data.result !== "undefined") {
                            setResultText("= " + data.result);
                            loadFiles();
                        }
                    })
                    .catch(function (err) {
                        if (err && err.detail) {
                            setResultText(err.detail);
                        } else {
                            setResultText("Error evaluating expression");
                        }
                    });
            }

            uploadForm.addEventListener("submit", function (e) {
                e.preventDefault();
                uploadStatus.textContent = "";
                if (!fileInput.files.length) {
                    uploadStatus.textContent = "Choose a .py file first.";
                    return;
                }
                var formData = new FormData();
                formData.append("file", fileInput.files[0]);
                fetch("/upload", { method: "POST", body: formData })
                    .then(function (resp) {
                        return resp.json().then(function (data) {
                            if (!resp.ok) {
                                throw data;
                            }
                            return data;
                        });
                    })
                    .then(function (data) {
                        uploadStatus.textContent = data.message || "Uploaded.";
                        fileInput.value = "";
                        loadFiles();
                    })
                    .catch(function (err) {
                        if (err && err.detail) {
                            uploadStatus.textContent = err.detail;
                        } else {
                            uploadStatus.textContent = "Upload failed.";
                        }
                    });
            });

            document.querySelectorAll("[data-key]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    var key = btn.getAttribute("data-key");
                    if (key === "C") {
                        clearDisplay();
                    } else if (key === "=") {
                        uploadExpressionAndCalculate(display.value);
                    } else {
                        appendToDisplay(key);
                    }
                });
            });

            display.addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    uploadExpressionAndCalculate(display.value);
                }
            });

            loadFiles();
        });
    </script>

</body>
</html>
