[supervisord]
; Run in the foreground so Docker can keep the container alive
nodaemon=true

[program:external_api]
; Command to run the public service
command=/bin/sh -c "/opt/external_api/serve.sh"
directory=/opt/external_api/
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:internal_api]
; Command to run the private service
command=/bin/sh -c "/opt/internal_api/serve.sh"
directory=/opt/internal_api/
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
