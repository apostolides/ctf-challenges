<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HaxorClicker</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <h1>⬡ <span style="color:var(--accent)">HAXOR</span>CLICKER</h1>
    <p class="auth-sub">Sign in to track your score.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>

    <p class="auth-link">No account? <a href="/register">Register</a></p>
  </div>
</div>
<footer style="position:fixed;bottom:0;width:100%;text-align:center;padding:0.75rem;font-size:0.75rem;color:var(--muted);">
  &copy; 2026 OsorinCorp. All rights reserved.
</footer>
</body>
</html>
